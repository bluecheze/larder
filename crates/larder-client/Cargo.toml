[package]
name = "larder-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
filetime = "0.2.29"
futures-util = "0.3.34"
hex = "0.4.3"
larder-core = { version = "0.1.0", path = "../larder-core" }
notify = "8.2.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
webpki-roots = "1.0.11"

[dev-dependencies]
larder-host = { path = "../larder-host" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
